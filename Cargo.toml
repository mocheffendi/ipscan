[package]
name = "ipscan"
version = "0.5.1"
edition = "2021"
rust-version = "1.81"
description = "Fast, cross-platform TCP IP range and port scanner"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
dns-lookup = "2"
eframe = "0.31.1"
egui_extras = "0.31.1"
futures = "0.3"
indicatif = "0.17"
macaddr-ouidb = { version = "0.3.1", default-features = false, features = ["std"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time", "io-util"] }

[build-dependencies]
embed-resource = "3.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
